name: Update deck images

on:
  push:
    branches:
      - main
    paths:
      - "decks/**/theme_analysis.md"
      - "decks/**/THEME_ANALYSIS.md"
      - "decks/**/decklist.dck"
      - "decks/**/party.toml"
      - "scripts/generate_mosaic.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip Pillow

      - name: Regenerate mosaics
        run: python scripts/generate_mosaic.py

      - name: Commit updated images
        run: |
          if git diff --quiet -- 'decks/**/deck_mosaic.png' 'decks/**/deck_mosaic_preview.jpg' card_images; then
            echo "No image updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'decks/**/deck_mosaic.png' 'decks/**/deck_mosaic_preview.jpg' card_images
          git commit -m "ci: update generated card images [skip ci]"
          git push
